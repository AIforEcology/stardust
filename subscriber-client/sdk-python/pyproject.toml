[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. The import name stays `stargrain`, so existing code doesn't change.
name = "aifore-stargrain"
version = "0.2.0"
description = "Stargrain SDK by AIforE: meter Anthropic, OpenAI and Gemini API usage (measured tokens), see its cost, energy, CO2e and water, and request remediation, via Core."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AI for Ecology (AIforE)" }]
requires-python = ">=3.10"
dependencies = []  # stdlib only: an SDK shouldn't pull dependencies into your app
keywords = ["ai", "llm", "carbon", "sustainability", "metering", "opentelemetry", "anthropic", "openai", "gemini"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://aifore.org"
Repository = "https://github.com/AIforEcology/stardust"
Documentation = "https://github.com/AIforEcology/stardust/blob/main/docs/developers.md"
Changelog = "https://github.com/AIforEcology/stardust/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Emit OpenTelemetry GenAI spans: Stargrain(otel=True)
otel = ["opentelemetry-api>=1.20"]
# Only needed to run the tests against the real vendor response types.
dev = ["build>=1.2", "pytest>=8", "anthropic>=0.40", "openai>=1.50", "google-genai>=1.0", "opentelemetry-sdk>=1.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stargrain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The product spec version this package implements (docs/, schema/spec-version.json).
# Separate from the methodology version in schema/factors/.
[tool.stardust]
spec_version = "1.7"
