name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege; actions pinned to commit SHAs (spec §14.2).
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "middleware[dev]" -e "providers-service[dev]" -e "subscriber-client/sdk-python[dev]"
      - run: pytest middleware providers-service subscriber-client/sdk-python
      # The spec sync tool (docs/tools) needs only lxml.
      - run: pip install "lxml>=4.9"
      - run: pytest docs/tools

  mcp:
    # The MCP Python SDK needs Python 3.10+; the rest of Stardust also supports 3.9.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e "middleware[dev]" -e "providers-service[dev]" -e "mcp[dev]"
      # The servers' own tests, plus the spec conformance test, which checks their tool sets.
      - run: pytest mcp middleware/tests/test_conformance.py

  browser-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subscriber-client/browser-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  extension-version:
    # static/manifest.json must carry package.json's version (scripts/sync-version.mjs).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subscriber-client/browser-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run check-version

  sdk-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subscriber-client/sdk-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ledger:
    # Data Center Resource Ledger (ledger/). Tests run against PostgreSQL 17 + PostGIS 3. GitHub runners
    # are amd64, where the published postgis/postgis image works; production (arm64) builds its own
    # image from deploy/ledger-db.Dockerfile, which this job also builds.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LEDGER_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e "ledger[dev]"
      # With CI set, conftest fails instead of skipping when the database is missing.
      - run: pytest ledger -ra
      - run: docker build -f deploy/ledger-db.Dockerfile -t ledger-db:ci deploy
      - run: docker run --rm --entrypoint sh ledger-db:ci -c 'ls /usr/share/postgresql/17/extension/postgis.control'
      - run: docker build -f deploy/ledger.Dockerfile -t ledger:ci .
      - run: docker run --rm ledger:ci python -c "import ledger.main"
