name: Core uptime

# Daily check of the hosted Core (deploy/README.md). It also checks the server runs main: the commits
# reported by /healthz and /ledger/healthz must not be more than a day behind a CI-passed commit that
# changes that service (deploy/auto-deploy.sh deploys them; this catches it stopping).
# On failure: Slack #ops-alerts (if SLACK_OPS_WEBHOOK is set) and one open `ops-alert` issue,
# commented on rather than duplicated. On success: any open `ops-alert` issue is closed as recovered.
on:
  schedule:
    - cron: "7 17 * * *" # 17:07 UTC, 10:07 PT (PDT)
  workflow_dispatch:

permissions:
  contents: read # checkout, to compare the deployed commits with main
  checks: read # whether CI passed on a commit
  issues: write

concurrency:
  group: core-uptime
  cancel-in-progress: false

env:
  CORE_URL: https://core.aifore.org
  MIN_PRICED_MODELS: "1000"
  MAX_BEHIND_HOURS: "24"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check /healthz and the admin block
        id: check
        shell: bash
        run: |
          set -uo pipefail
          problems=""
          for attempt in 1 2 3; do
            problems=""
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 "$CORE_URL/healthz" || echo 000)
            if [ "$code" != "200" ]; then
              problems+="/healthz returned HTTP $code. "
            elif ! jq -e . "$body" >/dev/null 2>&1; then
              problems+="/healthz did not return JSON. "
            else
              jq -e '.ok == true' "$body" >/dev/null || problems+="ok is $(jq -c '.ok' "$body"), not true. "
              jq -e --argjson min "$MIN_PRICED_MODELS" '(.priced_models | type) == "number" and .priced_models > $min' "$body" >/dev/null \
                || problems+="priced_models is $(jq -c '.priced_models' "$body"), not over $MIN_PRICED_MODELS. "
              jq -e '.ingest_auth == "required"' "$body" >/dev/null || problems+="ingest_auth is $(jq -c '.ingest_auth' "$body"), not \"required\". "
              jq -e '.subscriber_auth == "required"' "$body" >/dev/null || problems+="subscriber_auth is $(jq -c '.subscriber_auth' "$body"), not \"required\". "
            fi
            admin=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$CORE_URL/v1/admin/keys" || echo 000)
            [ "$admin" = "404" ] || problems+="/v1/admin/keys returned HTTP $admin, not 404. "
            if [ -z "$problems" ]; then
              echo "Attempt $attempt: all checks passed ($(jq -c '{ok, priced_models, ingest_auth, subscriber_auth}' "$body"))."
              break
            fi
            echo "Attempt $attempt failed: $problems"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "problems=$problems" >> "$GITHUB_OUTPUT"
          [ -z "$problems" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          fetch-depth: 0

      - name: Check the server runs main
        id: behind
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          problems=""
          now=$(date +%s)
          # behind <name> <health URL> <services that put this endpoint's code on the server...>
          behind() {
            local name="$1" url="$2" reported base c services stale=() s
            shift 2
            reported=$(curl -sS --max-time 20 "$url" | jq -r '.commit // empty' 2>/dev/null)
            if [ -z "$reported" ]; then
              problems+="$name: $url did not report a commit. "; return
            fi
            if [ "$reported" = "unknown" ]; then
              # Built by hand without GIT_COMMIT (deploy/README.md): can't tell; the next deploy sets it.
              echo "::warning::$name reports commit \"unknown\"; skipping its behind-main check."; return
            fi
            if ! base=$(git rev-parse -q --verify "$reported^{commit}"); then
              problems+="$name reports commit $reported, which is not in the repository. "; return
            fi
            if ! git merge-base --is-ancestor "$base" origin/main; then
              problems+="$name runs $reported, which is not on main. "; return
            fi
            local total
            total=$(git rev-list --first-parent --count "$base..origin/main")
            # Each commit main moved through since the deployed one, oldest first.
            for c in $(git rev-list --first-parent --reverse "$base..origin/main"); do
              services=$(git diff --name-only "$c^1" "$c" | bash deploy/auto-deploy.sh changed-services)
              for s in "$@"; do
                if grep -qx "$s" <<<"$services"; then
                  [ $((now - $(git show -s --format=%ct "$c"))) -gt $((MAX_BEHIND_HOURS * 3600)) ] || break
                  [ "$(bash deploy/auto-deploy.sh ci-status "$c")" = success ] || break
                  stale+=("$(git show -s --format='%h %cs %s' "$c")")
                  break
                fi
              done
            done
            echo "$name runs $reported; main is $total commit(s) ahead; ${#stale[@]} CI-passed change(s) to it waiting over ${MAX_BEHIND_HOURS}h."
            if [ ${#stale[@]} -gt 0 ]; then
              problems+="$name runs $reported, $total commit(s) behind main; ${#stale[@]} CI-passed change(s) to it not deployed after ${MAX_BEHIND_HOURS}h: $(printf '%s; ' "${stale[@]}")Check \`journalctl -u stardust-auto-deploy\` on the server. "
            fi
          }
          behind "Core" "$CORE_URL/healthz" all core
          behind "Ledger" "$CORE_URL/ledger/healthz" all ledger ledger-db
          echo "problems=$problems" >> "$GITHUB_OUTPUT"
          [ -z "$problems" ]

      - name: Alert Slack
        if: failure() && (steps.check.outcome == 'failure' || steps.behind.outcome == 'failure')
        env:
          SLACK_OPS_WEBHOOK: ${{ secrets.SLACK_OPS_WEBHOOK }}
          PROBLEMS: ${{ steps.check.outputs.problems }}${{ steps.behind.outputs.problems }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_OPS_WEBHOOK" ]; then
            echo "SLACK_OPS_WEBHOOK is not set; skipping Slack."
            exit 0
          fi
          jq -n --arg text ":rotating_light: Stardust Core uptime check failed for $CORE_URL: ${PROBLEMS:-the check did not finish} <$RUN_URL|Run log>" '{text: $text}' \
            | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$SLACK_OPS_WEBHOOK"

      - name: Open or update the ops-alert issue
        if: failure() && (steps.check.outcome == 'failure' || steps.behind.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBLEMS: ${{ steps.check.outputs.problems }}${{ steps.behind.outputs.problems }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ops-alert --color B60205 --description "Automated alert from the Core uptime check" 2>/dev/null || true
          msg="Uptime check failed at $(date -u +%Y-%m-%dT%H:%MZ): ${PROBLEMS:-the check did not finish}

          Run log: $RUN_URL"
          issue=$(gh issue list --label ops-alert --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$msg"
          else
            gh issue create --label ops-alert --title "Core uptime check failing: $CORE_URL" --body "$msg

          This issue closes itself when a later check passes. Hosting runbook: deploy/README.md."
          fi

      - name: Close any open ops-alert issue as recovered
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for issue in $(gh issue list --label ops-alert --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "Recovered: all checks passed at $(date -u +%Y-%m-%dT%H:%MZ). Run log: $RUN_URL"
          done
