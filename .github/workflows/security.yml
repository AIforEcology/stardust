name: Security

# Runs on every push and PR, and every Monday so newly published vulnerabilities in
# unchanged dependencies are still caught. Findings fail the job.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      # Every installed dependency of Core, against PyPI's and OSV's advisory databases. Core itself
      # isn't on PyPI, so it is skipped; no --strict, which would turn that skip into a failure.
      # Any vulnerable dependency still fails the job.
      - run: pip install -e middleware && pip-audit --skip-editable

  python-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install bandit
      # B608: the store builds WHERE clauses from fixed strings with ? placeholders (reviewed).
      - run: bandit -r middleware/src providers-service -ll --skip B608

  npm-deps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [subscriber-client/browser-extension, subscriber-client/sdk-js]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --audit-level=moderate

  container-image:
    # Builds the Core image and scans its OS packages and Python libraries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/Dockerfile -t stardust-core:scan .
      # The image still starts: Core's app imports on the image's Python, without pip.
      - run: docker run --rm stardust-core:scan python -c "import stardust_core.main"
      - name: Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed stardust-core:scan

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --redact
