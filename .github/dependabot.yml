# Opens a PR when a dependency has a security fix or a new version. Security PRs come as soon as an
# advisory is published (turn on Dependabot security updates in the repo's Settings → Code security).
# Minor and patch bumps are grouped into one weekly PR per directory; each major bump gets its own
# PR, since it may need code changes. At most 3 version-update PRs are open per directory.
version: 2
updates:
  - package-ecosystem: pip
    directory: /middleware
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /subscriber-client/browser-extension
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /subscriber-client/sdk-js
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # @opentelemetry/sdk-trace-base 2.12.0 accepts only api <1.10.0, so npm ci fails on 1.10.
      # Remove once a sdk-trace-base release accepts api 1.10.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
