[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stardust-intel"
version = "0.1.0"
description = "Stardust Data Center Intelligence (DCI): provider footprints for Stardust Core, built from the Data Center Resource Ledger and EIA grid data."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Read the ledger's database directly (on the server). Needs the ledger package, which needs Python 3.11+:
#   pip install -e ledger -e "intel[db]"
db = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[project.scripts]
stardust-intel = "stardust_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
