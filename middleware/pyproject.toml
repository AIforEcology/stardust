[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stardust-core"
version = "0.1.0"
description = "Stardust Core: usage-event ingestion, cost and environmental-impact enrichment, indicator codes, and the remediation broker."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  # OpenTelemetry receiver/exporter (spec §11). 1.41.x is the last line supporting Python 3.9.
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-proto>=1.30",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30",
  "grpcio>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
